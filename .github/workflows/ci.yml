name: CI

# Nothing ran on a push before this existed. The design-system audit had been
# failing on `main` for long enough that the failure itself went unnoticed,
# which is roughly the whole argument for having this file.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Each check is its own step so a red run says which one failed on the
      # summary page, without opening the log.
      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Design system
        run: npm run audit:design-system

      # Last because it is the slowest, and because everything above tends to
      # explain a build failure faster than the build does. Deliberately still
      # here: Vercel only builds the branch it watches, so a PR onto anything
      # else would otherwise never be compiled at all.
      - name: Build
        run: npx next build

  # Its own job: it needs a JVM and downloads the emulator suite, so it would
  # slow the fast checks down for no reason. Runs in parallel with them.
  #
  # Worth having at all because firestore.rules and storage.rules are the only
  # thing standing between a paid cookbook and anyone who asks for it, and they
  # are not exercised by anything else — `npm test` can't reach them, and the
  # emulator needs Java that a laptop may not have.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The emulator suite is a JVM program; ubuntu-latest ships a JDK but pin
      # it rather than depending on whatever the image happens to carry.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Security rules
        run: npm run test:rules

      # The real Firebase Auth SDK against the Auth emulator. Rides in this job
      # because it already has the emulator tooling installed; the Auth emulator
      # itself needs no JVM. It existed for a long time without running
      # anywhere but a laptop, which is the same failure the comment at the
      # top of this file describes.
      - name: Auth flows
        run: npm run test:auth

  # The app in a real browser (Playwright), against a production build on
  # localhost. Its own job because it builds the app and downloads Chromium.
  # Nothing here can reach production: analytics only starts on the production
  # hostnames, and no test talks to live Firebase, CookPilot or RevenueCat.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      # Screenshots and a step-by-step trace of whatever failed. Fixture data
      # only, never a real customer's.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
